<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS INFERNO | Legendary Server Builder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060c);
            font-family: 'Poppins', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* أنيميشن خلفية نارية */
        .fire-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, rgba(255,80,40,0.05) 0px, rgba(255,80,40,0.05) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* الهيدر الأسطوري */
        .hero {
            text-align: center;
            padding: 50px 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            margin-bottom: 50px;
            border: 1px solid rgba(255,80,40,0.5);
            box-shadow: 0 0 50px rgba(255,60,30,0.3);
        }
        .hero h1 {
            font-size: 70px;
            background: linear-gradient(135deg, #ff4d4d, #ff9f4a, #ff4d4d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255,77,77,0.5);
        }
        .hero p {
            font-size: 20px;
            color: #ccc;
            margin-top: 15px;
        }
        .enter-btn {
            background: linear-gradient(135deg, #ff4d4d, #ff2a2a);
            border: none;
            padding: 18px 50px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            margin-top: 35px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 20px #ff4d4d;
            color: white;
        }
        .enter-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px #ff4d4d;
        }

        /* كروت الأدوات */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        .tool-card {
            background: rgba(15, 20, 30, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255,100,50,0.4);
            transition: 0.2s;
            cursor: pointer;
        }
        .tool-card:hover {
            transform: translateY(-10px);
            border-color: #ff4d4d;
            box-shadow: 0 15px 35px rgba(255,77,77,0.2);
        }
        .tool-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .tool-card h3 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .tool-card p {
            color: #aaa;
        }

        /* وضع البناء */
        .builder-panel {
            display: none;
            background: rgba(10,15,25,0.95);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 30px;
            margin-top: 40px;
            border: 1px solid #ff4d4d;
        }
        .builder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .back-btn {
            background: #2a2f3f;
            border: none;
            padding: 10px 25px;
            border-radius: 40px;
            cursor: pointer;
            color: white;
        }
        .mock-server-view {
            background: #111418;
            border-radius: 30px;
            padding: 20px;
            min-height: 500px;
        }
        .category-item {
            margin-top: 20px;
            border-left: 4px solid #ff4d4d;
            padding-left: 15px;
        }
        .category-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1f2a;
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .channel-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f1219;
            padding: 8px 15px;
            border-radius: 15px;
            margin: 8px 0 8px 25px;
        }
        .privacy-btn {
            background: #2ea043;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }
        .privacy-btn.admin-only { background: #da373c; }
        .delete-channel-btn, .delete-cat-btn {
            background: #3b3f45;
            border: none;
            padding: 4px 10px;
            border-radius: 10px;
            margin-left: 8px;
            cursor: pointer;
        }
        .templates-section {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .template-badge {
            background: #1e2434;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.1s;
        }
        .template-badge:hover { background: #ff4d4d; }
        .decoration-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .decoration {
            background: #2a2f3f;
            padding: 8px 15px;
            border-radius: 30px;
            cursor: pointer;
            font-family: monospace;
        }
        .build-actions {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }
        .build-real-btn {
            background: #23a55a;
            padding: 15px 35px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }
        .delete-then-build {
            background: #da373c;
        }
    </style>
</head>
<body>
<div class="fire-bg"></div>
<div class="container">
    <div class="hero">
        <h1>⚡ NEXUS INFERNO ⚡</h1>
        <p>Build Legendary Discord Servers • Hidden Roles • Epic Templates</p>
        <button class="enter-btn" id="enterBuilderBtn">🔥 ENTER THE BUILDER 🔥</button>
    </div>

    <div class="tools-grid" id="toolsGrid">
        <div class="tool-card" data-tool="builder">
            <div class="tool-icon">🏗️</div>
            <h3>Server Builder</h3>
            <p>Build your dream server with drag & drop, hidden categories, and real-time simulation</p>
        </div>
    </div>

    <!-- لوحة البناء -->
    <div id="builderPanel" class="builder-panel">
        <div class="builder-header">
            <h2>🔥 SERVER SIMULATOR 🔥</h2>
            <button class="back-btn" id="closeBuilderBtn">← BACK</button>
        </div>

        <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px;">
            <div style="flex: 1; background: #0a0f1a; padding: 20px; border-radius: 25px;">
                <h3>➕ Create Category</h3>
                <input type="text" id="catName" placeholder="Category name" style="width:100%; padding:10px; margin:10px 0; border-radius:15px;">
                <button id="addCatBtn" style="background:#5865f2; padding:10px; width:100%; border-radius:20px;">+ Add</button>
            </div>
            <div style="flex: 1; background: #0a0f1a; padding: 20px; border-radius: 25px;">
                <h3>📁 Create Channel</h3>
                <input type="text" id="chName" placeholder="Channel name" style="width:100%; padding:10px; margin:10px 0; border-radius:15px;">
                <select id="parentSelect" style="width:100%; padding:10px; border-radius:15px;"></select>
                <button id="addChBtn" style="background:#5865f2; padding:10px; width:100%; margin-top:10px;">+ Add</button>
            </div>
            <div style="flex: 1; background: #0a0f1a; padding: 20px; border-radius: 25px;">
                <h3>✨ Templates & Decorations</h3>
                <div class="templates-section" id="templatesList"></div>
                <div class="decoration-list" id="decorationsList"></div>
            </div>
        </div>

        <div class="mock-server-view" id="mockServerView"></div>

        <div class="build-actions">
            <button id="buildRealBtn" class="build-real-btn">🚀 BUILD (Keep existing)</button>
            <button id="buildRealDeleteBtn" class="build-real-btn delete-then-build">💀 DELETE ALL & BUILD</button>
        </div>
        <div style="margin-top: 15px; text-align: center;">
            <input type="text" id="botTokenInput" placeholder="Bot Token" style="padding:10px; width:300px; border-radius:30px;">
            <input type="text" id="guildIdInput" placeholder="Target Server ID" style="padding:10px; width:200px; border-radius:30px;">
        </div>
    </div>
</div>

<script>
    let mockData = { categories: [], channels: [] };
    let nextId = 1;

    // 10 تيمبليتات أسطورية
    const templates = [
        { name: "⚔️ Gaming Empire", categories: ["🎮 GAMES", "🗣️ VOICE", "📢 ANNOUNCE"], channels: { "🎮 GAMES": ["valorant", "fortnite", "lol"], "🗣️ VOICE": ["general", "competitive"], "📢 ANNOUNCE": ["rules", "updates"] } },
        { name: "🤖 AI Hub", categories: ["🧠 AI CHAT", "🛠️ TOOLS"], channels: { "🧠 AI CHAT": ["gpt-talk", "midjourney"], "🛠️ TOOLS": ["bot-commands", "api-test"] } },
        { name: "🎵 Music Studio", categories: ["🎧 MUSIC", "🎤 COLLAB"], channels: { "🎧 MUSIC": ["beats", "lyrics"], "🎤 COLLAB": ["producers", "artists"] } },
        { name: "📚 Study Zone", categories: ["📖 SUBJECTS", "🧘 FOCUS"], channels: { "📖 SUBJECTS": ["math", "programming"], "🧘 FOCUS": ["study-with-me", "resources"] } },
        { name: "🛒 Crypto Traders", categories: ["📈 TRADING", "💎 SIGNALS"], channels: { "📈 TRADING": ["btc", "eth", "sol"], "💎 SIGNALS": ["premium", "discussion"] } },
        { name: "🎭 Anime World", categories: ["🍥 SHONEN", "🌸 SEASONAL"], channels: { "🍥 SHONEN": ["one-piece", "naruto"], "🌸 SEASONAL": ["new-episodes", "recommend"] } },
        { name: "🚀 Startup Hub", categories: ["💡 IDEAS", "🤝 NETWORKING"], channels: { "💡 IDEAS": ["pitch", "feedback"], "🤝 NETWORKING": ["founders", "investors"] } },
        { name: "🎥 Streaming", categories: ["🎬 LIVE", "📹 CLIPS"], channels: { "🎬 LIVE": ["twitch", "kick"], "📹 CLIPS": ["highlights", "editing"] } },
        { name: "🧘 Wellness", categories: ["🧘 MEDITATION", "🥗 HEALTH"], channels: { "🧘 MEDITATION": ["daily-checkin", "mindfulness"], "🥗 HEALTH": ["recipes", "workout"] } },
        { name: "🌍 Travel", categories: ["✈️ DESTINATIONS", "📸 PHOTOS"], channels: { "✈️ DESTINATIONS": ["europe", "asia"], "📸 PHOTOS": ["travel-pics", "tips"] } }
    ];

    const decorations = ["✨", "🔥", "💀", "🎮", "🤖", "⚡", "🍕", "🎵", "📚", "🚀", "💎", "🌸", "💡", "🎬", "🧘", "🌍", "🏰", "👑", "⭐", "🌀"];

    function loadTemplate(template) {
        mockData = { categories: [], channels: [] };
        nextId = 1;
        const catIdMap = {};
        for (const catName of template.categories) {
            const id = nextId++;
            mockData.categories.push({ id, name: catName, hidden: false });
            catIdMap[catName] = id;
        }
        for (const [catName, chList] of Object.entries(template.channels)) {
            const parentId = catIdMap[catName];
            if (parentId) {
                for (const chName of chList) {
                    mockData.channels.push({ id: nextId++, name: chName, parentCategoryId: parentId, hidden: false });
                }
            }
        }
        renderMockServer();
        updateSelectors();
    }

    function updateSelectors() {
        const select = document.getElementById('parentSelect');
        select.innerHTML = '<option value="">— No Category —</option>';
        mockData.categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat.id;
            opt.textContent = cat.name;
            select.appendChild(opt);
        });
    }

    function toggleChannelPrivacy(channelId) {
        const ch = mockData.channels.find(c => c.id === channelId);
        if (ch) ch.hidden = !ch.hidden;
        renderMockServer();
    }

    function toggleCategoryPrivacy(catId) {
        const cat = mockData.categories.find(c => c.id === catId);
        if (cat) cat.hidden = !cat.hidden;
        renderMockServer();
    }

    function renderMockServer() {
        const container = document.getElementById('mockServerView');
        container.innerHTML = '';
        const visibleCats = mockData.categories;
        const channelsWithoutCat = mockData.channels.filter(ch => !ch.parentCategoryId);
        channelsWithoutCat.forEach(ch => {
            const div = document.createElement('div');
            div.className = 'channel-item';
            div.innerHTML = `<span># ${ch.name} ${ch.hidden ? '🔒' : '👁️'}</span>
                <div><button class="privacy-btn ${ch.hidden ? 'admin-only' : ''}" data-id="${ch.id}" data-type="channel">${ch.hidden ? 'ADMIN ONLY' : 'PUBLIC'}</button>
                <button class="delete-channel-btn" data-id="${ch.id}">🗑️</button></div>`;
            container.appendChild(div);
        });
        visibleCats.forEach(cat => {
            const catDiv = document.createElement('div');
            catDiv.className = 'category-item';
            catDiv.innerHTML = `<div class="category-title"><span>📁 ${cat.name} ${cat.hidden ? '🔒' : '🌍'}</span>
                <div><button class="privacy-btn ${cat.hidden ? 'admin-only' : ''}" data-id="${cat.id}" data-type="category">${cat.hidden ? 'ADMIN ONLY' : 'PUBLIC'}</button>
                <button class="delete-cat-btn" data-id="${cat.id}">🗑️</button></div></div><div id="ch-${cat.id}"></div>`;
            const childContainer = catDiv.querySelector(`#ch-${cat.id}`);
            const catChannels = mockData.channels.filter(ch => ch.parentCategoryId === cat.id);
            catChannels.forEach(ch => {
                const chDiv = document.createElement('div');
                chDiv.className = 'channel-item';
                chDiv.innerHTML = `<span># ${ch.name} ${ch.hidden ? '🔒' : '👁️'}</span>
                    <div><button class="privacy-btn ${ch.hidden ? 'admin-only' : ''}" data-id="${ch.id}" data-type="channel">${ch.hidden ? 'ADMIN ONLY' : 'PUBLIC'}</button>
                    <button class="delete-channel-btn" data-id="${ch.id}">🗑️</button></div>`;
                childContainer.appendChild(chDiv);
            });
            container.appendChild(catDiv);
        });
        attachPrivacyEvents();
        attachDeleteEvents();
    }

    function attachPrivacyEvents() {
        document.querySelectorAll('.privacy-btn').forEach(btn => {
            btn.onclick = () => {
                const id = parseInt(btn.getAttribute('data-id'));
                const type = btn.getAttribute('data-type');
                if (type === 'channel') toggleChannelPrivacy(id);
                else toggleCategoryPrivacy(id);
            };
        });
    }
    function attachDeleteEvents() {
        document.querySelectorAll('.delete-channel-btn').forEach(btn => {
            btn.onclick = () => {
                const id = parseInt(btn.getAttribute('data-id'));
                mockData.channels = mockData.channels.filter(ch => ch.id !== id);
                renderMockServer();
            };
        });
        document.querySelectorAll('.delete-cat-btn').forEach(btn => {
            btn.onclick = () => {
                const id = parseInt(btn.getAttribute('data-id'));
                mockData.categories = mockData.categories.filter(c => c.id !== id);
                mockData.channels = mockData.channels.filter(ch => ch.parentCategoryId !== id);
                renderMockServer();
            };
        });
    }

    function showToast(msg) { alert(msg); }

    document.getElementById('enterBuilderBtn').onclick = () => {
        document.getElementById('toolsGrid').style.display = 'none';
        document.getElementById('builderPanel').style.display = 'block';
        renderMockServer();
    };
    document.getElementById('closeBuilderBtn').onclick = () => {
        document.getElementById('builderPanel').style.display = 'none';
        document.getElementById('toolsGrid').style.display = 'grid';
    };
    document.getElementById('addCatBtn').onclick = () => {
        const name = document.getElementById('catName').value.trim();
        if (!name) return;
        mockData.categories.push({ id: nextId++, name, hidden: false });
        renderMockServer();
        updateSelectors();
        document.getElementById('catName').value = '';
    };
    document.getElementById('addChBtn').onclick = () => {
        const name = document.getElementById('chName').value.trim();
        if (!name) return;
        const parentId = document.getElementById('parentSelect').value;
        mockData.channels.push({ id: nextId++, name, parentCategoryId: parentId ? parseInt(parentId) : null, hidden: false });
        renderMockServer();
        updateSelectors();
        document.getElementById('chName').value = '';
    };
    document.getElementById('buildRealBtn').onclick = async () => {
        const token = document.getElementById('botTokenInput').value.trim();
        const guildId = document.getElementById('guildIdInput').value.trim();
        if (!token || !guildId) return showToast('Enter Bot Token & Server ID');
        const res = await fetch('/api/build', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, guildId, mockup: mockData, deleteFirst: false }) });
        const data = await res.json();
        showToast(data.message || data.error);
    };
    document.getElementById('buildRealDeleteBtn').onclick = async () => {
        const token = document.getElementById('botTokenInput').value.trim();
        const guildId = document.getElementById('guildIdInput').value.trim();
        if (!token || !guildId) return showToast('Enter Bot Token & Server ID');
        const res = await fetch('/api/build', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, guildId, mockup: mockData, deleteFirst: true }) });
        const data = await res.json();
        showToast(data.message || data.error);
    };

    // تحميل التيمبليتات والزخارف
    const templatesDiv = document.getElementById('templatesList');
    templates.forEach(t => {
        const btn = document.createElement('div');
        btn.className = 'template-badge';
        btn.innerText = t.name;
        btn.onclick = () => loadTemplate(t);
        templatesDiv.appendChild(btn);
    });
    const decoDiv = document.getElementById('decorationsList');
    decorations.forEach(d => {
        const span = document.createElement('span');
        span.className = 'decoration';
        span.innerText = d;
        span.onclick = () => {
            const input = document.getElementById('catName');
            input.value += d + ' ';
        };
        decoDiv.appendChild(span);
    });
    renderMockServer();
    updateSelectors();
</script>
</body>
</html>
