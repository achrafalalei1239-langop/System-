<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060c);
            font-family: 'Poppins', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* خلفية نارية */
        .fire-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, rgba(255,80,40,0.05) 0px, rgba(255,80,40,0.05) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px;
        }

        /* الهيدر */
        .hero {
            text-align: center;
            padding: 30px 15px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,80,40,0.5);
        }
        .hero h1 {
            font-size: clamp(28px, 8vw, 65px);
            background: linear-gradient(135deg, #ff4d4d, #ff9f4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .hero p {
            font-size: clamp(12px, 4vw, 18px);
            color: #ccc;
            margin-top: 8px;
        }
        .enter-btn {
            background: linear-gradient(135deg, #ff4d4d, #ff2a2a);
            border: none;
            padding: 12px 25px;
            font-size: clamp(16px, 5vw, 22px);
            font-weight: bold;
            border-radius: 50px;
            margin-top: 18px;
            cursor: pointer;
            color: white;
            width: 90%;
            max-width: 280px;
            transition: 0.2s;
        }
        .enter-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px #ff4d4d;
        }

        /* أدوات */
        .tools-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (min-width: 768px) {
            .tools-grid {
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            }
        }
        .tool-card {
            background: rgba(15, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255,100,50,0.4);
            transition: 0.2s;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            border-color: #ff4d4d;
        }
        .tool-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }
        .tool-card h3 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        /* لوحة البناء */
        .builder-panel {
            display: none;
            background: rgba(10,15,25,0.95);
            backdrop-filter: blur(20px);
            border-radius: 35px;
            padding: 20px;
            margin-top: 25px;
            border: 1px solid #ff4d4d;
        }
        .builder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        .back-btn {
            background: #2a2f3f;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }
        .input-group {
            background: #0a0f1a;
            padding: 18px;
            border-radius: 25px;
            margin-bottom: 20px;
        }
        .input-group h3 {
            margin-bottom: 12px;
            color: #ff9f4a;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #2a2f3f;
            background: #111418;
            color: white;
            margin: 8px 0;
            font-size: 14px;
        }
        button {
            background: #5865f2;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.1s;
        }
        button:hover {
            background: #4752c4;
        }
        .row-2col {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        @media (min-width: 900px) {
            .row-2col {
                flex-direction: row;
            }
            .row-2col > div {
                flex: 1;
            }
        }

        /* واجهة المحاكاة */
        .mock-server-view {
            background: #111418;
            border-radius: 25px;
            padding: 18px;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            margin: 20px 0;
        }
        .category-item {
            margin-top: 18px;
            border-left: 4px solid #ff4d4d;
            padding-left: 12px;
        }
        .category-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1f2a;
            padding: 10px 15px;
            border-radius: 18px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .channel-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f1219;
            padding: 8px 15px;
            border-radius: 14px;

            flex-wrap: wrap;
            gap: 8px;

            background: #2ea043;

            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
        }
        .privacy-btn.admin-only {
            background: #da373c;
        }
        .delete-btn {
            background: #3b3f45;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
        }

        /* زخارف */
        .decorations-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .deco-item {
            background: #2a2f3f;
            padding: 6px 12px;
            border-radius: 25px;
            cursor: pointer;
            font-family: monospace;
            font-size: 16px;
            transition: 0.1s;
        }
        .deco-item:hover {
            background: #ff4d4d;
        }
        .template-badge {
            background: #1e2434;
            padding: 8px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            display: inline-block;
            margin: 4px;
        }
        .template-badge:hover {
            background: #ff4d4d;
        }
        .build-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        @media (min-width: 600px) {
            .build-actions {
                flex-direction: row;
                justify-content: center;
            }
        }
        .build-real-btn {
            background: #23a55a;
            padding: 12px 25px;
            font-size: 16px;
        }
        .delete-then-build {
            background: #da373c;
        }
        .token-inputs {
            margin-top: 15px;
            text-align: center;
        }
        .token-inputs input {
            width: 90%;
            max-width: 300px;
            margin: 5px;
        }
        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1f22;
            border-left: 4px solid #23a55a;
            padding: 12px 20px;
            border-radius: 30px;
            z-index: 1000;
            display: none;
            font-size: 14px;
            white-space: nowrap;
        }
        @media (max-width: 500px) {
            .toast-msg { white-space: normal; width: 90%; text-align: center; }
        }
    </style>
</head>

            channels: {
                "✈️ DESTINATIONS": ["europe", "asia", "north-america", "south-america", "africa", "australia"],
                "📸 PHOTOS": ["travel-pics", "drone-shots", "sunset", "landscapes", "city-views"],

                "🏨 ACCOMMODATION": ["hotels", "hostels", "airbnb", "camping", "house-sitting"],
                "🍜 FOOD": ["street-food", "restaurants", "local-cuisine", "food-reviews", "recipes"]
            }
        }
    ];

    // تحميل تيمبليت
    function loadTemplate(template) {
        mockData = { categories: [], channels: [] };
        nextId = 1;
        const catIdMap = {};
        for (const catName of template.categories) {
            const id = nextId++;
            mockData.categories.push({ id, name: catName, hidden: false });
            catIdMap[catName] = id;
        }
        for (const [catName, chList] of Object.entries(template.channels)) {
            const parentId = catIdMap[catName];
            if (parentId) {
                for (const chName of chList) {
                    mockData.channels.push({ id: nextId++, name: chName, parentCategoryId: parentId, hidden: false });
                }
            }
        }
        renderMockServer();
        updateSelectors();
        showToast(`✅ Template loaded: ${template.name} with ${mockData.channels.length} channels!`);
    }

    function updateSelectors() {
        const select = document.getElementById('parentSelect');
        select.innerHTML = '<option value="">— No Category —</option>';
        mockData.categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat.id;
            opt.textContent = cat.name;
            select.appendChild(opt);
        });
    }

    function toggleCategoryPrivacy(catId) {
        const cat = mockData.categories.find(c => c.id === catId);
        if (cat) cat.hidden = !cat.hidden;
        renderMockServer();
    }

    function toggleChannelPrivacy(chId) {
        const ch = mockData.channels.find(c => c.id === chId);
        if (ch) ch.hidden = !ch.hidden;
        renderMockServer();
    }

    function renderMockServer() {
        const container = document.getElementById('mockServerView');
        container.innerHTML = '';
        
        const channelsWithoutCat = mockData.channels.filter(ch => !ch.parentCategoryId);
        channelsWithoutCat.forEach(ch => {
            const div = document.createElement('div');
            div.className = 'channel-item';
            div.innerHTML = `
                <span># ${ch.name} ${ch.hidden ? '🔒' : '🌍'}</span>
                <div>
                    <button class="privacy-btn ${ch.hidden ? 'admin-only' : ''}" data-id="${ch.id}" data-type="channel">${ch.hidden ? 'ADMIN ONLY' : 'PUBLIC'}</button>
                    <button class="delete-btn" data-id="${ch.id}" data-type="channel">🗑️</button>
                </div>
            `;
            container.appendChild(div);
        });

        mockData.categories.forEach(cat => {
            const catDiv = document.createElement('div');
            catDiv.className = 'category-item';
            catDiv.innerHTML = `
                <div class="category-title">
                    <span>📁 ${cat.name} ${cat.hidden ? '🔒' : '🌍'}</span>
                    <div>
                        <button class="privacy-btn ${cat.hidden ? 'admin-only' : ''}" data-id="${cat.id}" data-type="category">${cat.hidden ? 'ADMIN ONLY' : 'PUBLIC'}</button>
                        <button class="delete-btn" data-id="${cat.id}" data-type="category">🗑️</button>
                    </div>
                </div>
                <div id="ch-${cat.id}"></div>
            `;
            const childContainer = catDiv.querySelector(`#ch-${cat.id}`);
            const catChannels = mockData.channels.filter(ch => ch.parentCategoryId === cat.id);
            catChannels.forEach(ch => {
                const chDiv = document.createElement('div');
                chDiv.className = 'channel-item';
                chDiv.innerHTML = `
                    <span># ${ch.name} ${ch.hidden ? '🔒' : '🌍'}</span>
                    <div>
                        <button class="privacy-btn ${ch.hidden ? 'admin-only' : ''}" data-id="${ch.id}" data-type="channel">${ch.hidden ? 'ADMIN ONLY' : 'PUBLIC'}</button>
                        <button class="delete-btn" data-id="${ch.id}" data-type="channel">🗑️</button>
                    </div>
                `;
                childContainer.appendChild(chDiv);
            });
            container.appendChild(catDiv);
        });

        attachEvents();
    }

    function attachEvents() {
        document.querySelectorAll('.privacy-btn').forEach(btn => {
            btn.onclick = () => {
                const id = parseInt(btn.getAttribute('data-id'));
                const type = btn.getAttribute('data-type');
                if (type === 'category') toggleCategoryPrivacy(id);
                else toggleChannelPrivacy(id);
            };
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.onclick = () => {
                const id = parseInt(btn.getAttribute('data-id'));
                const type = btn.getAttribute('data-type');
                if (type === 'category') {
                    mockData.categories = mockData.categories.filter(c => c.id !== id);
                    mockData.channels = mockData.channels.filter(ch => ch.parentCategoryId !== id);
                } else {
                    mockData.channels = mockData.channels.filter(ch => ch.id !== id);
                }
                renderMockServer();
                updateSelectors();
                showToast('🗑️ Deleted');
            };
        });
    }

    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2500);
    }

    // إضافة زخرفة للنص
    function addDecoration(inputId, deco) {
        const input = document.getElementById(inputId);
        input.value += deco + ' ';
        input.focus();
    }

    // BUILD
    async function buildServer(deleteFirst) {
        const token = document.getElementById('botTokenInput').value.trim();
        const guildId = document.getElementById('guildIdInput').value.trim();
        if (!token || !guildId) {
            showToast('❌ Enter Bot Token & Server ID');
            return;
        }
        showToast('🚀 Building server with Promise.all...');
        try {
            const res = await fetch('/api/build', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, guildId, mockup: mockData, deleteFirst })
            });
            const data = await res.json();
            showToast(data.message || data.error || 'Done!');
        } catch(e) {
            showToast('❌ Error: ' + e.message);
        }
    }

    // ========== Event Listeners ==========
    document.getElementById('enterBuilderBtn').onclick = () => {
        document.getElementById('toolsGrid').style.display = 'none';
        document.getElementById('builderPanel').style.display = 'block';
        renderMockServer();
    };
    document.getElementById('closeBuilderBtn').onclick = () => {
        document.getElementById('builderPanel').style.display = 'none';
        document.getElementById('toolsGrid').style.display = 'grid';
    };
    document.getElementById('addCatBtn').onclick = () => {
        const name = document.getElementById('catName').value.trim();
        if (!name) { showToast('Enter category name'); return; }
        mockData.categories.push({ id: nextId++, name, hidden: false });
        renderMockServer();
        updateSelectors();
        document.getElementById('catName').value = '';
        showToast('✅ Category added');
    };
    document.getElementById('addChBtn').onclick = () => {
        const name = document.getElementById('chName').value.trim();
        if (!name) { showToast('Enter channel name'); return; }
        const parentId = document.getElementById('parentSelect').value;
        mockData.channels.push({ id: nextId++, name, parentCategoryId: parentId ? parseInt(parentId) : null, hidden: false });
        renderMockServer();
        updateSelectors();
        document.getElementById('chName').value = '';
        showToast('✅ Channel added');
    };
    document.getElementById('buildRealBtn').onclick = () => buildServer(false);
    document.getElementById('buildRealDeleteBtn').onclick = () => buildServer(true);

    // تحميل التيمبليتات
    const templatesDiv = document.getElementById('templatesList');
    templates.forEach(t => {
        const btn = document.createElement('span');
        btn.className = 'template-badge';
        btn.innerText = t.name;
        btn.onclick = () => loadTemplate(t);
        templatesDiv.appendChild(btn);
    });

    // زخارف للكاتيجوري
    const decoCat = document.getElementById('decoCat');
    const decoCh = document.getElementById('decoCh');
    textDecorations.slice(0, 30).forEach(deco => {
        const span = document.createElement('span');
        span.className = 'deco-item';
        span.innerText = deco;
        span.onclick = () => addDecoration('catName', deco);
        decoCat.appendChild(span);
        
        const span2 = document.createElement('span');
        span2.className = 'deco-item';
        span2.innerText = deco;
        span2.onclick = () => addDecoration('chName', deco);
        decoCh.appendChild(span2);
    });

    renderMockServer();
    updateSelectors();
</script>
</body>
</html>
